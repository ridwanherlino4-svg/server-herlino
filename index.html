<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fase 1: Pengenalan Konsep VPS & Cloud</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #ffffff;
            color: #1a202c;
            margin: 0;
            padding: 30px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 900px;
        }

        /* Kotak Identitas di Bagian Atas */
        .header-box {
            border: 1px solid #cbd5e1;
            border-left: 5px solid #232f3e;
            padding: 20px 25px;
            margin-bottom: 35px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            background-color: #f8fafc;
        }

        .info-item {
            display: flex;
            flex-direction: column;
        }

        .info-label {
            font-size: 12px;
            color: #64748b;
            font-weight: 600;
            text-transform: uppercase;
            margin-bottom: 6px;
        }

        .info-value {
            font-size: 16px;
            font-weight: 600;
            color: #0f172a;
            border-bottom: 2px dashed #cbd5e1;
            padding-bottom: 6px;
        }

        /* Judul Utama */
        .section-title {
            color: #ff9900; /* Warna oranye khas AWS */
            font-size: 22px;
            font-weight: 700;
            margin: 0 0 12px 0;
            padding-bottom: 10px;
            border-bottom: 1px solid #e2e8f0;
        }

        .instruction {
            font-size: 15px;
            line-height: 1.5;
            color: #1e293b;
            margin-bottom: 25px;
        }

        /* Grid 2 Kolom untuk Kartu Materi */
        .grid-cards {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }

        .card {
            border: 1px solid #cbd5e1;
            border-top: 4px solid #232f3e; /* Garis atas tebal berwarna biru gelap */
            padding: 20px;
            background-color: #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-height: 140px;
        }

        .card-title {
            font-size: 16px;
            font-weight: 700;
            color: #1e293b;
            margin: 0 0 15px 0;
        }

        /* Area Input / Garis Putus-putus */
        .answer-input {
            width: 100%;
            border: none;
            border-bottom: 2px dashed #cbd5e1;
            padding: 8px 0;
            font-size: 14px;
            color: #334155;
            outline: none;
            resize: none;
            background: transparent;
        }

        .answer-input:focus {
            border-bottom-color: #ff9900;
        }

        /* Responsif untuk layar HP */
        @media (max-width: 650px) {
            .header-box, .grid-cards {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <!-- Kotak Identitas Siswa -->
    <div class="header-box">
        <div class="info-item">
            <span class="info-label">Nama Lengkap</span>
            <span class="info-value">Muhammad Ridwan Herlino</span>
        </div>
        <div class="info-item">
            <span class="info-label">Kelas</span>
            <span class="info-value">XI PPL 1</span>
        </div>
    </div>

    <!-- Judul dan Instruksi -->
    <h1 class="section-title">Fase 1: Pengenalan Konsep VPS & Cloud</h1>
    <p class="instruction">
        Jelaskan secara singkat pemahaman Anda mengenai perbedaan layanan berikut dengan mengisi kotak yang tersedia.
    </p>

    <!-- 4 Kotak Layanan -->
    <div class="grid-cards">
        <div class="card">
            <h2 class="card-title">Shared Hosting
